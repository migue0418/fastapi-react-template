services:
  # Comprobación previa de la contraseña: PostgreSQL solo arranca si termina bien.
  # No imprime la contraseña. Todo $ del shell va escrito $$ porque Compose interpola ${...}.
  postgres-check:
    image: postgres:15
    entrypoint: ["sh", "-c"]
    command:
      - |
        n=$$(printf %s "$$POSTGRES_PASSWORD" | wc -m)
        if [ "$$n" -lt 16 ] || [ "$$POSTGRES_PASSWORD" = "postgres" ]; then
          echo "Error: POSTGRES_PASSWORD debe tener al menos 16 caracteres y no puede ser 'postgres'." >&2
          echo "Cámbiala en el archivo .env de la raíz del repositorio." >&2
          echo "Genera una con: python -c \"import secrets; print(secrets.token_hex(24))\"" >&2
          exit 1
        fi
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD. Defínela en el archivo .env de la raíz del repositorio (cópialo de .example.env). Mínimo 16 caracteres.}"
    restart: "no"

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: fastapi_template
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD. Defínela en el archivo .env de la raíz del repositorio (cópialo de .example.env). Mínimo 16 caracteres.}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fastapi_template"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    ports:
      # Solo local: los tests y el desarrollo usan 127.0.0.1:5432 y la base no queda abierta a la red.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    depends_on:
      postgres-check:
        condition: service_completed_successfully
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD. Defínela en el archivo .env de la raíz del repositorio (cópialo de .example.env). Mínimo 16 caracteres.}@postgres:5432/fastapi_template"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data:
