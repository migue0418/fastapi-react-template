# Project commands, by purpose. Never list production deploys or infrastructure applies.
commands:
  install:
    - "cd backend && uv sync"
    - "cd frontend && npm install"
  database:             # PostgreSQL local; el puerto 5432 puede estar ocupado por otro proyecto (ver architecture.md, 9.2)
    - "docker compose up -d postgres"
  test:                 # requiere PostgreSQL; la URL de administración se toma de TEST_DATABASE_ADMIN_URL (ver README, Tests)
    - "cd backend && uv run python -m pytest -q"
    - "cd frontend && npm run test"
  check:
    - "cd frontend && npm run lint"
  build:
    - "cd frontend && npm run build"
    - "docker compose build backend"
  run:
    - "cd backend && uv run uvicorn app.main:app --reload"
    - "cd frontend && npm run dev"
    - "docker compose up --build"

# The tools the project's work relies on outside the code.
tools:
  - purpose: code-hosting-and-review
    tool: GitHub
    access: cli
    where: "https://github.com/migue0418/fastapi-react-template"
    use: "Repositorio y pull requests, con gh. No hay tablero: el backlog vive en .sdd/roadmap.md."
    status: decided
    practice: EP-003

  - purpose: ci
    tool: GitHub Actions
    access: cli
    where: "https://github.com/migue0418/fastapi-react-template"
    use: "Ejecutar lint, tests y build en cada pull request. Aún no existe; lo entrega RM-05."
    status: proposed
    practice: null

  - purpose: e2e-browser
    tool: Playwright MCP
    access: mcp
    where: "conector de la sesión de Claude Code"
    use: "E2E de los cambios de UI, ejecutados por el agente."
    status: decided
